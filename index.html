<title>Engleski za mamu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one calm column like a school notebook page (ruled lines, red margin); dark theme becomes a chalkboard. Big tap targets for a beginner. */
:root {
  --paper: #F6F1E7;
  --ink: #23201C;
  --muted: #6B6358;
  --rule: #EFE7D8;
  --margin: #A8432F;
  --accent: #22409A;
  --accent-ink: #FFFFFF;
  --gold: #B8862B;
  --card: #FFFCF6;
  --line: #E4DACA;
  --good: #2E7D4F;
  --good-bg: #E5F2E8;
  --bad: #A63A2B;
  --bad-bg: #F8E4DF;
  --skin: #F2C9A5;
  --skin-line: #B9825B;
  --shirt: #6F95E8;
  --pants: #3E4C6E;
  --hair: #5B3A22;
  --f-display: "Fraunces", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161B; --ink: #EEE8DC; --muted: #A9A093; --rule: #252932; --margin: #E8907A;
    --accent: #E0B654; --accent-ink: #14161B; --gold: #E0B654; --card: #1D2027; --line: #30343D;
    --good: #82D2A2; --good-bg: #1E3A2B; --bad: #F0907F; --bad-bg: #42241F;
    --skin: #E9BE97; --skin-line: #F1E3D3; --shirt: #5F86D8; --pants: #8A97B8; --hair: #3A2416;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161B; --ink: #EEE8DC; --muted: #A9A093; --rule: #252932; --margin: #E8907A;
    --accent: #E0B654; --accent-ink: #14161B; --gold: #E0B654; --card: #1D2027; --line: #30343D;
    --good: #82D2A2; --good-bg: #1E3A2B; --bad: #F0907F; --bad-bg: #42241F;
    --skin: #E9BE97; --skin-line: #F1E3D3; --shirt: #5F86D8; --pants: #8A97B8; --hair: #3A2416;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  color: var(--ink);
  font: 400 19px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.page { max-width: 720px; margin: 0 auto; position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.page > * { min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(30px, 7vw, 40px); }
h2 { font-size: 26px; }
p { margin: 0; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [data-pick]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 0; padding: 8px 0; font-size: 18px; color: var(--accent); font-weight: 700; min-height: 48px; }
.slow { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-size: 16px; min-height: 44px; }
.slow[aria-pressed="true"] { border-color: var(--accent); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }

/* Today panel */
.today { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.today-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
.stat b { font-family: var(--f-display); font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { display: block; color: var(--muted); font-size: 16px; }
.goal { height: 14px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.goal i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .4s; }
.big { display: flex; width: 100%; justify-content: center; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 16px 20px; font-size: 21px; font-weight: 700; min-height: 60px; }
.big.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }

/* Phrase of the day: the one bold moment, written like on the blackboard */
.phrase { padding: 4px 0 4px 18px; border-left: 3px solid var(--gold); display: grid; gap: 4px; }
.phrase .en { font-family: var(--f-display); font-size: clamp(26px, 6vw, 34px); font-weight: 500; font-style: italic; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.phrase .sr { font-size: 19px; }
.phrase .hint { color: var(--muted); font-size: 17px; }
.label { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--margin); }
/* Header and tabs (same look as the Srpski app) */
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: clamp(34px, 8vw, 42px); }
.brand span { font-family: var(--f-display); font-style: italic; font-size: 22px; color: var(--gold); }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1.5px solid var(--line); margin-top: -6px; }
.nav button { background: none; border: 0; padding: 12px 4px 10px; font-weight: 700; font-size: 18px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; min-height: 52px; }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold); }
.lvname { font-family: var(--f-display); font-size: 26px; }
.scene .gi { font-size: 30px; line-height: 1; }

/* Lessons */
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.lesson { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; min-height: 112px; }
.lesson:hover { border-color: var(--gold); }
.lesson .no { font-family: var(--f-display); font-size: 15px; color: var(--gold); font-weight: 600; }
.lesson.next { border-color: var(--accent); }
.lesson .t { font-family: var(--f-display); font-size: 20px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.lesson .n { font-size: 15px; color: var(--muted); }
.bar { height: 8px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.peek { display: flex; gap: 4px; align-items: center; }
.peek .sw { width: 16px; height: 16px; }

/* Topic tabs */
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 5px; }
.tabs button { border: 0; background: none; border-radius: 10px; padding: 10px 2px; font-weight: 700; font-size: 17px; min-height: 48px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 480px) { .tabs button { font-size: 15px; } }

/* Visual helpers: real colors, numerals, day tiles, pictures */
.sw { display: inline-block; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(0,0,0,.18); flex: none; }
.vis { width: 52px; display: grid; place-items: center; font-size: 34px; line-height: 1; }
.vis .num { font-family: var(--f-display); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; }
.vis .day { font-family: var(--f-display); font-weight: 600; font-size: 16px; border: 2px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--paper); }

/* Word list */
.words { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
.words li { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.words li:first-child { border-top: 0; }
.words .en { font-weight: 700; font-size: 21px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.words .sr { font-size: 18px; }
.words .hint { color: var(--muted); font-size: 16px; }
.words .w { min-width: 0; }
.ok-mark { font-size: 14px; font-weight: 700; color: var(--good); background: var(--good-bg); border-radius: 999px; padding: 1px 8px; }
.say { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); display: inline-grid; place-items: center; }
.say svg { width: 22px; height: 22px; }
.say:hover { border-color: var(--accent); }
.say.lg { width: 64px; height: 64px; }
.say.lg svg { width: 30px; height: 30px; }

/* Flashcard */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 24px 20px; min-height: 240px; display: grid; gap: 12px; place-content: center; text-align: center; }
.card .pic { font-size: 64px; line-height: 1; display: grid; place-items: center; }
.card .pic .sw { width: 84px; height: 84px; }
.card .pic .num { font-family: var(--f-display); font-weight: 600; font-size: 64px; }
.card .pic .day { font-family: var(--f-display); font-weight: 600; font-size: 30px; border: 2px solid var(--line); border-radius: 12px; padding: 6px 14px; }
.card .en { font-family: var(--f-display); font-size: clamp(32px, 9vw, 46px); font-weight: 600; overflow-wrap: anywhere; }
.card .sr { font-size: 24px; font-weight: 700; }
.card .hint { color: var(--muted); font-size: 19px; }
.card .row { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
.count { text-align: center; color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair .no { background: var(--bad-bg); color: var(--bad); }
.pair .yes { background: var(--good-bg); color: var(--good); }

/* Quiz */
.options { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 18px; font-size: 21px; min-height: 60px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.right { border-color: var(--good) !important; background: var(--good-bg) !important; }
.wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.feedback { font-weight: 700; font-size: 19px; text-align: center; min-height: 1.5em; }
.feedback.ok { color: var(--good); }
.feedback.no { color: var(--bad); }
.done { text-align: center; display: grid; gap: 12px; padding: 12px 0; }
.done .score { font-family: var(--f-display); font-size: 54px; font-weight: 600; }

/* Game: tap the right thing */
.prompt { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; }
.prompt .en { font-family: var(--f-display); font-size: clamp(30px, 8vw, 42px); font-weight: 600; }
.prompt .ask { width: 100%; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 16px; min-height: 92px; display: grid; place-items: center; padding: 8px; }
.tile:hover:not(:disabled) { border-color: var(--accent); }
.tile:disabled { cursor: default; }
.tile .sw { width: 58px; height: 58px; }
.tile .emo { font-size: 46px; line-height: 1; }
.tile .num { font-family: var(--f-display); font-weight: 600; font-size: 34px; font-variant-numeric: tabular-nums; }
.tile .day { font-family: var(--f-display); font-weight: 600; font-size: 22px; }
.tile .cap { font-size: 15px; font-weight: 700; margin-top: 4px; }

/* Body game */
.bodywrap { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 8px; }
.bodywrap svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
.fig { stroke: var(--skin-line); stroke-width: 2; }
.zone { fill: transparent; cursor: pointer; }
.zone.flash-ok { fill: rgba(31,138,76,.35); }
.zone.flash-no { fill: rgba(185,58,50,.35); }
.tag rect { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
.tag text { fill: var(--ink); font: 700 15px var(--f-body); }
.tag.ok rect { fill: var(--good-bg); stroke: var(--good); }
.tag.no rect { fill: var(--bad-bg); stroke: var(--bad); }
.tag line { stroke: var(--muted); stroke-width: 1.5; }

.note { font-size: 16px; color: var(--muted); }
.level { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 18px; }
.cal-wrap { display: grid; gap: 10px; }
.cal-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.cal-head .muted { font-size: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; }
.wd { text-align: center; font: 600 13px var(--f-display); color: var(--muted); letter-spacing: .04em; }
.day-cell { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font: 600 16px/1 var(--f-display); color: var(--ink); background: var(--paper); border: 2px solid var(--line); }
.day-cell.blank { visibility: hidden; }
.day-cell.future { color: var(--muted); border-style: dashed; background: transparent; }
.day-cell.missed { color: var(--muted); opacity: .6; }
.day-cell.some { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.day-cell.full { background: var(--gold); color: var(--card); border-color: var(--gold); font-size: 18px; }
.day-cell.is-today { box-shadow: 0 0 0 3px var(--accent); }
.key { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; }
.key.some { background: var(--good-bg); border: 1.5px solid var(--good); }
.key.full { background: var(--good); }
.stars { font-size: 20px; letter-spacing: 2px; color: var(--line); line-height: 1; }
.stars .on { color: var(--gold); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.badge { background: var(--card); border: 1.5px dashed var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; justify-items: center; text-align: center; opacity: .5; filter: grayscale(1); }
.badge.got { opacity: 1; filter: none; border-style: solid; border-color: var(--good); }
.badge .bi { font-size: 34px; line-height: 1.1; }
.badge b { font-size: 16px; }
.badge span:last-child { font-size: 14px; color: var(--muted); }
.celeb { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(10, 18, 32, .55); }
.celeb-box { background: var(--card); color: var(--ink); border-radius: 22px; padding: 28px 22px; max-width: 420px; width: 100%; display: grid; gap: 12px; text-align: center; border: 2px solid var(--gold); }
.celeb-title { font-family: var(--f-display); font-weight: 500; font-style: italic; font-size: 46px; color: var(--gold); }
.celeb-box p { font-size: 20px; }
.celeb-sign { font-family: var(--f-display); color: var(--muted); font-size: 18px !important; }
.celeb-sign::before { content: "— "; }
.confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.intro { background: var(--card); border: 1.5px solid var(--gold); border-radius: 18px; padding: 20px; display: grid; gap: 12px; }
.intro ol { margin: 0; padding-left: 24px; display: grid; gap: 10px; }
.intro ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.intro .mini { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 1.5px solid var(--line); border-radius: 50%; vertical-align: middle; }
.intro .mini svg { width: 16px; height: 16px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.saved { font-size: 15px; color: var(--muted); }
.saved.on { color: var(--good); font-weight: 700; }
.backup { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.backup summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
.backup-in { display: grid; gap: 10px; padding-top: 10px; }
.backup input { width: 100%; font: 700 22px/1.2 var(--f-body); letter-spacing: .15em; text-transform: uppercase; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; }
.code { letter-spacing: .08em; }
.backup textarea { width: 100%; font: 14px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
/* Tap (phone) or hover (computer) an English word for its Serbian meaning */
.gw { cursor: help; border-bottom: 2px dotted var(--gold); border-radius: 2px; }
.gw:hover, .gw.on { background: var(--rule); }
.pop { position: fixed; z-index: 40; max-width: min(320px, calc(100vw - 24px)); background: var(--card); color: var(--ink); border: 1.5px solid var(--gold); border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); font: 400 17px/1.4 var(--f-body); text-align: left; display: grid; gap: 4px; }
.pop .f { font-family: var(--f-display); font-size: 24px; font-weight: 600; }
.pop .b { color: var(--muted); font-size: 16px; }
.pop .e { font-weight: 700; font-size: 19px; }
.pop .g { font-size: 14px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--margin); }
.pop .w { font-size: 16px; }
.tip-tap { font-size: 16px; color: var(--muted); }
/* Talk */
.scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.scene { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; min-height: 96px; }
.scene:hover { border-color: var(--gold); }
.scene .t { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.scene .d { font-size: 15px; color: var(--muted); }
.chat { display: grid; gap: 12px; }
.msg { max-width: 90%; border-radius: 16px; padding: 12px 14px; display: grid; gap: 6px; }
.msg.bot { background: var(--card); border: 1.5px solid var(--line); justify-self: start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 4px; font-size: 20px; }
.msg .en { font-size: 21px; line-height: 1.45; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.msg .sr { font-size: 17px; color: var(--muted); }
.fix { justify-self: end; max-width: 90%; background: var(--bad-bg); border-radius: 12px; padding: 10px 14px; font-size: 17px; display: grid; gap: 4px; }
.fix b { color: var(--bad); }
.fix.good { background: var(--good-bg); }
.fix.good b { color: var(--good); }
.sugg { display: grid; gap: 8px; }
.sugg button { text-align: left; border: 1.5px dashed var(--line); background: transparent; border-radius: 12px; padding: 8px 12px; font-size: 18px; }
.sugg button span { display: block; font-size: 15px; color: var(--muted); }
.composer { position: sticky; bottom: 0; background: var(--paper); padding: 8px 0 4px; display: grid; gap: 8px; border-top: 1.5px solid var(--line); }
.composer .rowc { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.composer textarea { width: 100%; min-height: 60px; max-height: 150px; resize: vertical; font: 400 20px/1.4 var(--f-body); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; }
.composer .big { width: auto; padding: 0 22px; }
.typing { color: var(--muted); font-style: italic; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="page" id="app" aria-live="polite"></div>

<script>
/* ---------- Content: [English, Serbian, pronunciation in Serbian letters, picture]
   picture: "#hex" = a real color, "n:12" = a numeral, "d:PON" = a day tile, anything else = an emoji ---------- */

function bodySvg(all) {
  const g = V.g, k = g.items[g.i], a = g.answered;
  const zones = Object.entries(BODY).map(([key, b], n) => {
    const cls = a && !all ? (key === k ? " flash-ok" : key === a ? " flash-no" : "") : "";
    return `<g class="zone${cls}" data-pick="${key}" role="button" tabindex="${all || a ? -1 : 0}" aria-label="Mesto ${n + 1}">${b.zone}</g>`;
  }).join("");
  const tags = Object.entries(BODY).filter(([key]) => all || key in g.placed).map(([key, b]) => {
    const w = BY_KEY[key], [lx, ly, anchor] = b.lab, wpx = w.en.length * 9 + 16;
    const rx = anchor === "end" ? lx - wpx : lx;
    const st = key in g.placed ? (g.placed[key] ? " ok" : " no") : "";
    return `<g class="tag${st}"><line x1="${anchor === "end" ? lx : lx}" y1="${ly}" x2="${b.pt[0]}" y2="${b.pt[1]}"/>
      <rect x="${rx}" y="${ly - 13}" width="${wpx}" height="26" rx="8"/><text x="${rx + 8}" y="${ly + 5}">${esc(w.en)}</text></g>`;
  }).join("");
  return `<div class="bodywrap"><svg viewBox="0 0 300 390" role="img" aria-label="Crtež čoveka">${FIGURE}${zones}${tags}</svg></div>`;
}

function review() {
  return `${topBar("home")}<h1>Ponavljanje</h1><p class="muted">Reči koje je vreme da ponoviš, iz svih lekcija.</p>${deckBody()}`;
}
function render() {
  setTimeout(showCeleb, 50);
  hidePop();
  app.innerHTML = V.screen === "topic" ? topic() : V.screen === "review" ? review() : V.screen === "talk" ? (V.chat ? chatView() : talkHome()) : V.screen === "progress" ? progressView() : home();
}

/* ---------- Word meanings: tap (phone) or hover (computer) ---------- */
let LEX = {};
const CHATLEX = {};
const lookup = (form, chat) => { const f = form.toLowerCase().replace(/’/g, "'"); return (chat && CHATLEX[f]) || LEX[f] || CHATLEX[f] || null; };
function gl(text, chat) {
  return String(text).split(/([A-Za-z]+(?:['’][A-Za-z]+)?)/).map((part, i) => i % 2 && lookup(part, chat)
    ? `<span class="gw" data-w="${esc(part)}" data-c="${chat ? "chat" : ""}">${esc(part)}</span>` : esc(part)).join("");
}
let popEl = null, popFor = null, popTimer = null, popAt = 0;
function hidePop() { clearTimeout(popTimer); if (popEl) popEl.remove(); popEl = null; if (popFor) popFor.classList.remove("on"); popFor = null; }
function showPop(el) {
  if (popFor === el) return;
  hidePop();
  const form = el.dataset.w, x = lookup(form, el.dataset.c === "chat"); if (!x) return;
  popFor = el; el.classList.add("on"); popAt = Date.now();
  const p = document.createElement("div"); p.className = "pop"; p.setAttribute("role", "tooltip");
  p.innerHTML = `<div class="f">${esc(form)}</div>${x.b && x.b.toLowerCase() !== form.toLowerCase() ? `<div class="b">od reči <b>${esc(x.b)}</b></div>` : ""}<div class="e">${esc(x.e || "")}</div>${x.g ? `<div class="g">${esc(x.g)}</div>` : ""}${x.w ? `<div class="w">${esc(x.w)}</div>` : ""}`;
  document.body.appendChild(p); popEl = p;
  const r = el.getBoundingClientRect(), pr = p.getBoundingClientRect();
  const left = Math.min(Math.max(12, r.left + r.width / 2 - pr.width / 2), innerWidth - pr.width - 12);
  let top = r.bottom + 8; if (top + pr.height > innerHeight - 8) top = Math.max(8, r.top - pr.height - 8);
  p.style.left = left + "px"; p.style.top = top + "px";
  p.addEventListener("mouseenter", () => clearTimeout(popTimer));
  p.addEventListener("mouseleave", () => { popTimer = setTimeout(hidePop, 250); });
}
const hoverable = window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches;
document.addEventListener("mouseover", e => { if (!hoverable) return; const w = e.target.closest && e.target.closest(".gw"); if (w) { clearTimeout(popTimer); showPop(w); } });
document.addEventListener("mouseout", e => { if (!hoverable) return; const w = e.target.closest && e.target.closest(".gw"); if (w) { clearTimeout(popTimer); popTimer = setTimeout(hidePop, 300); } });
document.addEventListener("click", e => { if (!e.target.closest(".gw") && !e.target.closest(".pop")) hidePop(); }, true);
window.addEventListener("scroll", () => { if (!hoverable && Date.now() - popAt > 600) hidePop(); }, { passive: true });
fetch("lex.json").then(r => r.ok ? r.json() : {}).then(o => { LEX = o || {}; render(); }).catch(() => {});

/* ---------- Talk: simple English conversations, corrections explained in Serbian ---------- */
const CHAT_FN = "https://fszezlruwuyzdquomijs.supabase.co/functions/v1/eng-chat";
const SCENES = [
  ["upoznavanje", "👋", "Upoznavanje", "Neko te pita kako se zoveš i odakle si."],
  ["kafic", "☕", "U kafiću", "Naruči kafu, čaj ili kolač."],
  ["prodavnica", "🛒", "U prodavnici", "Kupi hleb, mleko i voće."],
  ["put", "🧭", "Pitanje za put", "Pitaj kako da stigneš do stanice ili hotela."],
  ["porodica", "👨‍👩‍👧", "Porodica", "Pričaj o deci i unucima."],
  ["dan", "☀️", "Vreme i dan", "Kakvo je vreme, šta radiš danas."],
  ["doktor", "🩺", "Kod doktora", "Reci šta te boli."],
  ["slobodno", "💬", "Slobodan razgovor", "O čemu god želiš."]
];
async function chatCall() {
  const c = V.chat; c.busy = true; c.err = ""; render();
  try {
    const res = await fetch(CHAT_FN, { method: "POST", headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ code: P.code, scene: c.scene, history: c.msgs.map(m => ({ role: m.role === "bot" ? "assistant" : "user", content: m.text })) }) });
    const o = await res.json().catch(() => ({}));
    if (!res.ok) c.err = o.error || "Nešto nije u redu. Probaj ponovo.";
    else {
      const last = c.msgs[c.msgs.length - 1];
      if (last && last.role === "me") last.fix = o.correction || false;
      (o.words || []).forEach(w => { if (w[0]) CHATLEX[String(w[0]).toLowerCase()] = { b: w[1] || "", e: w[2] || "", g: "", w: w[3] || "" }; });
      c.msgs.push({ role: "bot", text: o.reply, sr: o.reply_sr, sugg: o.suggest || [] });
      c.left = o.left;
      setTimeout(() => speak(o.reply), 200);
    }
  } catch (e) { c.err = "Nema interneta. Probaj kad se povežeš."; }
  if (V.chat === c) { c.busy = false; render(); const end = document.getElementById("chatend"); if (end) end.scrollIntoView({ block: "end" }); }
}
function chatSend() {
  const c = V.chat, el = document.getElementById("chatin"), t = (el ? el.value : "").trim();
  if (!c || !t || c.busy) return;
  c.msgs.push({ role: "me", text: t.slice(0, 600) }); c.draft = "";
  const td = todayKey(); P.days[td] = (P.days[td] || 0) + 1; save();
  chatCall();
}
function chatView() {
  const c = V.chat, sc = SCENES.find(s => s[0] === c.scene), last = c.msgs[c.msgs.length - 1];
  const msgs = c.msgs.map(m => m.role === "bot"
    ? `<div class="msg bot"><div class="en"><span>${gl(m.text, true)}</span>${sayBtn(m.text)}</div>${m.sr ? `<div class="sr">${esc(m.sr)}</div>` : ""}</div>`
    : `<div class="msg me">${esc(m.text)}</div>${m.fix ? `<div class="fix"><span><b>Bolje:</b> ${esc(m.fix.fixed)}</span><span>${esc(m.fix.why)}</span></div>` : m.fix === false ? `<div class="fix good"><b>✓ Tačno!</b></div>` : ""}`).join("");
  const sugg = !c.busy && last && last.role === "bot" && last.sugg && last.sugg.length ? `<div class="sugg"><span class="note">Ne znaš šta da kažeš? Dodirni predlog:</span>${last.sugg.map((x, i) => `<button data-sugg="${i}">${esc(x[0])}${x[1] ? `<span>${esc(x[1])}</span>` : ""}</button>`).join("")}</div>` : "";
  return `${topBar("talk")}<h1>${sc[1]} ${esc(sc[2])}</h1>
    <p class="tip-tap">Dodirni englesku reč da vidiš šta znači. Zvučnik ponavlja rečenicu.</p>
    <div class="chat">${msgs}${c.busy ? `<p class="typing">piše…</p>` : ""}${c.err ? `<div class="fix"><b>${esc(c.err)}</b></div>` : ""}${sugg}<span id="chatend"></span></div>
    <div class="composer">${c.left != null && c.left < 15 ? `<span class="note">Još ${c.left} poruka danas</span>` : ""}
      <div class="rowc"><textarea id="chatin" lang="en" placeholder="Write here… / Piši ovde…" autocapitalize="sentences">${esc(c.draft || "")}</textarea><button class="big" data-send ${c.busy ? "disabled" : ""}>Pošalji</button></div></div>`;
}

/* ---------- Events ---------- */
function pickAnswer(key) {
  const g = V.g; if (!g || g.answered || g.i >= g.items.length) return;
  const k = g.items[g.i], ok = key === k;
  g.answered = key; if (ok) g.right++;
  if (g.kind === "body") { g.placed[k] = ok; if (ok && g.i === g.items.length - 1 && g.right === g.items.length) { P.flags = P.flags || {}; P.flags.body = true; } }
  mark(k, ok);
  render();
}
app.addEventListener("click", e => {
  const gwEl = e.target.closest(".gw"); if (gwEl) { if (popFor === gwEl) hidePop(); else showPop(gwEl); return; }
  const tb = e.target.closest("button");
  if (tb) {
    const d = tb.dataset;
    if (d.scene) { V = { screen: "talk", chat: { scene: d.scene, msgs: [], busy: false } }; render(); window.scrollTo({ top: 0 }); chatCall(); return; }
    if (d.sugg !== undefined) { V.chat.draft = V.chat.msgs[V.chat.msgs.length - 1].sugg[+d.sugg][0]; render(); const t = document.getElementById("chatin"); if (t) t.focus(); return; }
    if (tb.hasAttribute("data-send")) { chatSend(); return; }
  }
  const z = e.target.closest("[data-pick]");
  if (z) { pickAnswer(z.dataset.pick); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.say) { speak(b.dataset.say); return; }
  if (b.hasAttribute("data-bkload")) {
    const msg = document.getElementById("bk-msg"), code = document.getElementById("bk-in").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!/^[A-Z2-9]{6}$/.test(code)) { msg.textContent = "Kod ima 6 znakova, slova i brojeve. Proveri da li je dobro ukucan."; return; }
    msg.textContent = "Tražim…";
    loadOnline(code).then(data => {
      if (!data) { msg.textContent = "Nisam našao taj kod. Proveri slova i brojeve."; return; }
      mergeIn(data); P.code = code; P.seen = earnedIds(); save(); pushOnline(); render();
      const m = document.getElementById("bk-msg"); if (m) { m.closest("details").open = true; m.textContent = "Gotovo! Napredak je vraćen."; }
    }).catch(() => { msg.textContent = "Nema interneta. Probaj ponovo kad se povežeš."; });
    return;
  }
  if (b.hasAttribute("data-slow")) { P.slow = !P.slow; save(); render(); return; }
  if (b.hasAttribute("data-mute")) { P.mute = !P.mute; if (P.mute && canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} } if (P.mute && V.tab === "listen") { V.tab = "words"; V.qs = null; } save(); render(); return; }
  if (b.hasAttribute("data-introok")) { P.intro = true; save(); render(); window.scrollTo({ top: 0 }); return; }
  if (b.hasAttribute("data-intro")) { P.intro = false; save(); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.go) { go({ screen: b.dataset.go }); return; }
  if (b.hasAttribute("data-review")) { V = { screen: "review" }; startDeck(shuffle(dueKeys()).slice(0, 15)); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.topic) { go({ screen: "topic", topic: b.dataset.topic, tab: b.dataset.tab || "words" }); return; }
  if (b.hasAttribute("data-flip")) { V.flip = true; speak(BY_KEY[V.deck[V.pos]].en); render(); return; }
  if (b.dataset.know) { const ok = b.dataset.know === "1"; mark(V.deck[V.pos], ok); if (ok) V.right++; V.pos++; V.flip = false; render(); return; }
  if (b.dataset.ans) {
    if (V.answered) return;
    const q = V.qs[V.qi], ok = b.dataset.ans === q.k; V.answered = b.dataset.ans; if (ok) V.right++; mark(q.k, ok);
    if (!V.listen) speak(BY_KEY[q.k].en);
    render(); return;
  }
  if (b.hasAttribute("data-next")) { V.qi++; V.answered = null; render(); if (V.listen && V.qi < V.qs.length) speak(BY_KEY[V.qs[V.qi].k].en); return; }
  if (b.hasAttribute("data-gnext")) { const g = V.g; g.i++; g.answered = null; newRound(); render(); if (g.i < g.items.length) speak(BY_KEY[g.items[g.i]].en); return; }
  if (b.hasAttribute("data-again")) {
    if (V.screen === "review") startDeck(shuffle(dueKeys().length ? dueKeys() : V.deck).slice(0, 15));
    else { V.deck = null; V.qs = null; V.g = null; }
    render(); return;
  }
});
app.addEventListener("input", e => { if (e.target.id === "chatin" && V.chat) V.chat.draft = e.target.value; });
document.addEventListener("keydown", e => { if (e.target.id === "chatin" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); } });
app.addEventListener("keydown", e => {
  const z = e.target.closest && e.target.closest("[data-pick]");
  if (z && (e.key === "Enter" || e.key === " ") && z.tagName !== "BUTTON") { e.preventDefault(); pickAnswer(z.dataset.pick); }
});
render();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
